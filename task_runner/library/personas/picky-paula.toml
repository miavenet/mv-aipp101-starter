  "Composition and testability: injected dependencies, pieces that can be tested alone, pure functions",
  "Class design: invariants, encapsulation, cohesion, const-correctness",
  "Readability: naming, magic numbers, comments that say why. Show the restructuring, with the extracted names",
]
blocking = [
  "A structure that will force a rewrite at the next planned step: a god class, duplication across components",
  "A significant design flaw: tight coupling, an untestable component, a clear single-responsibility violation",
  "A violation of the project rules in CLAUDE.md: a naked int, std::size_t, std::string or bool in a public interface, two parameters or public members sharing a type, a non-explicit constructor, noexcept anywhere but copy, move and pass-through generic code",
]
out_of_scope = [
