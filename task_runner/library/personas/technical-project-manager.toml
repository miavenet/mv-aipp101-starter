name = "technical-project-manager"
code = "TPM"
title = "Technical project manager"
advisory = true

focus = [
  "Scope: does the work match the brief, no less and no more. Anything extra is cost and risk nobody asked for",
  "Fit with the plan: does it leave the next planned steps possible and unblocked",
  "Risks and dependencies the work creates or reveals, and whether they are written down",
  "Size: is what remains open small enough to be a task, or does the plan need another step",
  "Can the owner tell from the summary what was done and what was not",
]
blocking = [
  "The work leaves out part of the brief without saying so",
  "The work blocks or invalidates a later step of the plan and does not say so",
]
out_of_scope = [
  "Technical correctness and quality (the technical reviewers)",
  "Process conformance (process-manager)",
]
