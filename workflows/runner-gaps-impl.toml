# Implementation phase for the runner gaps (owner's narrowed plan, 2026-09-20).
# G1 and G2 follow the "Implementation plan" of their accepted designs, one task per plan row;
# G3 is the reduced form: doctor names the cause it detected, and the dependency is documented.
# The tasks form ONE chain because they edit the same modules (engine.py, panels.py, record.py).
# G2 order (replanned 2026-09-22): T3, T3b, then T1+T1b as one task, as the design's plan requires.
# G2's scenario ids collide with G1's in places (both designs say RUN-18..21); G2's task T6 renumbers.
# Run from this worktree with the main checkout's runner:
#   /workspace/task_runner/runner --runs-dir runs <command> workflows/runner-gaps-impl.toml

name = "runner-gaps-impl"
root = ".."
library = ["../task_runner/library"]

[defaults]
agent = "claude"
complexity = "standard"
max_attempts = 4
timeout_min = 40
budget_usd = 8.0
run_budget_usd = 90.0
protected = ["task_runner/docs/design/**", "task_runner/library/**", "workflows/**", "task_runner/runner"]

[model_policy.standard]
claude = "claude-sonnet-5"
codex = "gpt-5.6-sol"

[model_policy.high]
claude = "claude-opus-5"
codex = "gpt-6-astra"

[agents.astra-review]
kind = "codex"
sandbox = "read-only"
ignore_user_config = true
extra_args = ["--enable", "use_legacy_landlock", "-c", 'model_reasoning_effort="high"']

[[task]]
id = "g1-01"
type = "implement"
complexity = "standard"
title = "G1 task 1: Publish a decision file under an intent"
needs = []
prompt = "Implement task 1 of the \"Implementation plan\" section of the accepted design task_runner/docs/design/runner-gaps/G1-recover-set-aside-work.md (G1), and nothing beyond it. Read the whole design first: the mechanism, state changes, exact messages and crash points it specifies are the contract, and the reviewer checks your change against it. Scenarios this task must make true, each with a test in the model-free suite named after its scenario row: REC-16. Where a scenario is split across tasks, cover the half named here and leave the rest. Earlier tasks of the plan are already on the branch; build on them rather than re-doing them. Follow the surrounding code's style; no new dependencies; every existing test must still pass (a test the design says to rewrite is the only exception). If the design is wrong or cannot be implemented as written, say so in your answer as a blocker instead of silently departing from it. In your summary, list the scenarios covered with their test names."
outputs = ["task_runner/src/taskrunner/record.py", "task_runner/tests/test_record.py"]
writes = ["task_runner/src/taskrunner/record.py", "task_runner/tests/test_record.py"]
gate = ["python3 -m unittest discover -s task_runner/tests -q"]
reviewers = [{ perspective = "principal-engineer", agent = "astra-review", model = "gpt-6-astra", complexity = "high", fallback_agents = ["claude"] }]

